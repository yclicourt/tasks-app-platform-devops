global:
  namespace: tasks-app
  registry:
    url: registry.local:5443
frontend:
  name: frontend-tasks-app
  image:
    repository: frontend-react-tasks/frontend-react-tasks
    tag: latest
  configMapName: frontend-tasks-config
  serviceName: frontend-tasks-svc
backend:
  name: backend-tasks-app
  image:
    repository: backend-django-tasks/backend-django-tasks
    tag: 839a92fa2dc339c9d3a5a3316e07ed6dd0bae30b
  secretName: backend-tasks-secret
  configMapName: backend-tasks-config
  serviceName: backend-tasks-svc
postgres:
  name: tasks-db
  image:
    repository: oficial-images/postgres
    tag: alpine
  secretName: postgres-db-secret
  volumeName: tasks-db-storage
  serviceName: tasks-db-svc
