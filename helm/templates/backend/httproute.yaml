apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-app-route
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: backend-app-route
spec:
  parentRefs:
    - name: tasks-app-gateway
  hostnames:
    - api-tasks.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.backend.serviceName }}
          port: 8000
