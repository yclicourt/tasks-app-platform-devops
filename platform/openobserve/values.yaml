# OpenObserve standalone - valores para k3s (homelab)
# Instalar con:
#   helm repo add openobserve https://charts.openobserve.ai
#   helm install o2 openobserve/openobserve-standalone -n openobserve --create-namespace -f values.yaml

auth:
  # CAMBIAR antes de instalar. Tambien se puede usar auth.existingRootUserSecret
  ZO_ROOT_USER_EMAIL: "admin@tasks.local"
  ZO_ROOT_USER_PASSWORD: "CambiarEstaClave123"

persistence:
  enabled: true
  size: 20Gi
  # "" usa el StorageClass por defecto (en k3s: local-path)
  storageClass: ""

config:
  # No enviar telemetria del homelab al vendor
  ZO_TELEMETRY: "false"
