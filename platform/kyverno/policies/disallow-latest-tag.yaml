apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/severity: medium
spec:
  background: true
  rules:
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Audit
        message: "No se permite el tag 'latest'. Usa tags inmutables (tu CI ya pushea el SHA del commit)."
        pattern:
          spec:
            containers:
              - name: "*"
                image: "!*:latest"
