apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform components managed via app-of-apps
  sourceRepos:
    - https://github.com/yclicourt/tasks-app-platform-devops.git
    - https://charts.openobserve.ai
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
