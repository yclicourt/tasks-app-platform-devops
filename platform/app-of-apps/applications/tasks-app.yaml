apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasks-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/yclicourt/tasks-app-platform-devops.git
    targetRevision: main
    path: helm
  destination:
    server: https://kubernetes.default.svc
    namespace: tasks-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
