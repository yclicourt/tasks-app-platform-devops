apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openobserve
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://charts.openobserve.ai
      chart: openobserve-standalone
      targetRevision: "*"
      helm:
        valueFiles:
          - $values/platform/openobserve/values.yaml
    - repoURL: https://github.com/yclicourt/tasks-app-platform-devops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: openobserve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
